<script>
const stage=document.getElementById('stage'),pullGroup=document.getElementById('pullGroup'),pullHit=document.getElementById('pullHit'),pullKnob=document.getElementById('pullKnob'),chainLine=document.getElementById('chainLine');
const REST_Y=156,MAX_PULL=60,TOGGLE_THRESHOLD=26;
let isOn=false,dragging=false,startClientY=0,currentDelta=0,animatingRelease=false;
function setKnobY(y){pullKnob.setAttribute('cy',y);pullHit.setAttribute('cy',y);chainLine.setAttribute('y2',y-6)}
function applyLight(s){isOn=s;stage.classList.toggle('lit',isOn);if(s){stage.classList.remove('flick');void stage.offsetWidth;stage.classList.add('flick')}}
function fit(){const sc=document.getElementById('scene');const k=Math.min(innerWidth/sc.offsetWidth,innerHeight/(sc.offsetHeight+40),1.25);sc.style.setProperty('--k',k)}
addEventListener('resize',fit);fit();
function onPointerDown(e){if(animatingRelease)return;dragging=true;pullGroup.classList.add('dragging');startClientY=(e.touches?e.touches[0].clientY:e.clientY);e.preventDefault()}
function onPointerMove(e){if(!dragging)return;const y=(e.touches?e.touches[0].clientY:e.clientY);let d=Math.max(0,Math.min(MAX_PULL,y-startClientY));currentDelta=d;setKnobY(REST_Y+d)}
function releaseSpring(t){animatingRelease=true;const steps=[REST_Y-8,REST_Y+4,REST_Y];let i=0;(function f(){if(i>=steps.length){animatingRelease=false;return}setKnobY(steps[i]);i++;setTimeout(f,120)})();if(t)applyLight(!isOn)}
function onPointerUp(){if(!dragging)return;dragging=false;pullGroup.classList.remove('dragging');const t=currentDelta>TOGGLE_THRESHOLD;releaseSpring(t);currentDelta=0}
pullHit.addEventListener('pointerdown',onPointerDown);
window.addEventListener('pointermove',onPointerMove);
window.addEventListener('pointerup',onPointerUp);
pullHit.addEventListener('touchstart',onPointerDown,{passive:false});
window.addEventListener('touchmove',onPointerMove,{passive:false});
window.addEventListener('touchend',onPointerUp);
pullHit.addEventListener('click',function(){if(dragging||animatingRelease)return;let y=REST_Y;const target=REST_Y+MAX_PULL*.7;animatingRelease=true;const t=setInterval(()=>{y+=5;if(y>=target){clearInterval(t);setTimeout(()=>{currentDelta=MAX_PULL*.7;releaseSpring(true)},60);return}setKnobY(y)},10)});
pullGroup.setAttribute('tabindex','0');pullGroup.setAttribute('role','button');pullGroup.setAttribute('aria-label','Pull chain to toggle lamp light');
pullGroup.addEventListener('keypress',e=>{if(e.key==='Enter'||e.key===' ')pullHit.dispatchEvent(new Event('click'))});


</script>
<div class="vsw" role="group" aria-label="Version"><button type="button" data-v="1" class="on">🧸 Version 1</button><button type="button" data-v="2">🌸 Version 2</button></div>
<script>(function(){var r=document.documentElement,bs=document.querySelectorAll('.vsw button');function set(v){r.setAttribute('data-v',v);bs.forEach(function(b){b.classList.toggle('on',b.dataset.v==v)})}bs.forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();set(b.dataset.v)})});set('1')})();</script>
